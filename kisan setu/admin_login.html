<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Kisan Setu - Admin Login</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f7faf7;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 900px;
            min-height: 520px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.10);
            display: flex;
            overflow: hidden;
        }

        /* LEFT SIDE */

        .left-section {
            width: 42%;
            background: #0b6b35;
            color: white;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .logo span {
            font-size: 18px;
        }

        .left-section h2 {
            font-size: 27px;
            margin-bottom: 15px;
        }

        .left-section p {
            font-size: 15px;
            line-height: 1.6;
            opacity: 0.95;
        }

        .admin-icon {
            width: 75px;
            height: 75px;
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            margin-bottom: 25px;
        }

        /* RIGHT SIDE */

        .right-section {
            width: 58%;
            padding: 50px 65px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-section h1 {
            color: #222;
            font-size: 29px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            height: 45px;
            padding: 0 14px;
            border: 1px solid #d6d6d6;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #278344;
        }

        .password-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .forgot-password {
            color: #278344;
            font-size: 13px;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 8px;
            background: #278344;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #1f6f39;
        }

        .security-note {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #888;
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
        }

        .back-link a {
            text-decoration: none;
            color: #278344;
            font-size: 13px;
        }

        @media (max-width: 700px) {

            .login-container {
                width: 92%;
                flex-direction: column;
            }

            .left-section,
            .right-section {
                width: 100%;
            }

            .left-section {
                padding: 30px;
            }

            .right-section {
                padding: 35px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- LEFT SECTION -->

        <div class="left-section">

            <div class="admin-icon">
                ♙
            </div>

            <div class="logo">
                <img src="images/logoks.jpeg" alt="Kisan Setu Logo">
                KISAN SETU
            </div>

            <h2>Admin Portal</h2>

            <p>
                Manage farmers, buyers, requests, payments,
                payments and marketplace activities from one
                centralized dashboard.
            </p>

        </div>


        <!-- RIGHT SECTION -->

        <div class="right-section">

            <h1>Admin Login</h1>

            <p class="subtitle">
                Login to access the Kisan Setu administration panel.
            </p>

            <div id="adminLoginError" style="display:none; background:#fee2e2; border:1px solid #f87171; color:#991b1b; padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px;"></div>

            <form id="adminLoginForm">

                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter admin email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <div class="password-row">

                        <label for="password">
                            Password
                        </label>

                        <a href="#" class="forgot-password">
                            Forgot Password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <p class="security-note">
                🔒 Authorized personnel only
            </p>

            <div class="back-link">
                <a href="index.html">
                    ← Back to Kisan Setu
                </a>
            </div>

        </div>

    </div>


    <script src="js/core/api.js"></script>
    <script src="js/core/auth.js"></script>
    <script>
        document
            .getElementById("adminLoginForm")
            .addEventListener("submit", async function(event) {
                event.preventDefault();

                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value.trim();
                const errBox = document.getElementById("adminLoginError");
                const btn = this.querySelector("button[type='submit']");

                if (email === "" || password === "") {
                    errBox.textContent = "Please enter both email and password.";
                    errBox.style.display = "block";
                    return;
                }

                errBox.style.display = "none";
                btn.disabled = true;
                btn.textContent = "Logging in...";

                try {
                    await loginUser({ identifier: email, password });
                    window.location.replace("admin_dashboard.html");
                } catch (err) {
                    errBox.textContent = friendlyErrorMessage(err, "Login failed. Please verify admin credentials.");
                    errBox.style.display = "block";
                    btn.disabled = false;
                    btn.textContent = "Login";
                }
            });
    </script>

</body>
</html>
