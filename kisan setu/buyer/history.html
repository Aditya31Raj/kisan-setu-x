<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kisan Setu - Order History</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="../css/buyer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


    <div class="dashboard">
        <aside class="sidebar">
            <div class="brand"><img src="../images/logoks.jpeg" alt="Kisan Setu Logo"><div class="brand-text"><h2>KISAN SETU</h2><span>BUYER / VENDOR PORTAL</span></div></div>
            <div class="user-box"><div class="user-info"><div class="user-icon"><i class="fa-solid fa-store"></i></div><div><strong id="buyerSidebarName">Loading...</strong><span id="buyerSidebarId">Buyer / Vendor</span></div></div></div>
            <nav class="sidebar-nav">
                <div class="nav-title">Main Menu</div>
                <a href="../buyer_dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
                <a href="produce.html" class="nav-item"><i class="fa-solid fa-wheat-awn"></i><span>Find Produce</span></a>
                <a href="orders.html" class="nav-item"><i class="fa-solid fa-box"></i><span>My Orders</span></a>
                <a href="payments.html" class="nav-item"><i class="fa-solid fa-credit-card"></i><span>Payments</span></a>
                <a href="logistics.html" class="nav-item"><i class="fa-solid fa-truck"></i><span>Logistics</span></a>
                <a href="history.html" class="nav-item active"><i class="fa-solid fa-clock-rotate-left"></i><span>Payment History</span></a>
                <a href="disputes.html" class="nav-item"><i class="fa-solid fa-triangle-exclamation"></i><span>Disputes</span></a>
                <a href="notifications.html" class="nav-item"><i class="fa-solid fa-bell"></i><span>Notifications</span></a>
                <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
            </nav>
            <div class="logout"><a href="javascript:void(0)" id="logoutBtn" class="nav-item logout-btn"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></div>
        </aside>
        <main class="main">



    <!-- MAIN CONTENT -->

    <main class="buyer-container">


        <section class="page-header">

            <h1>
                Order History
            </h1>

            <p>
                View your completed and past orders.
            </p>

        </section>



        <!-- FILTER -->

        <section class="history-filter">

            <label for="statusFilter">
                Filter by status:
            </label>


            <select id="statusFilter">

                <option value="ALL">
                    All
                </option>

                <option value="COMPLETED">
                    Completed
                </option>

                <option value="DELIVERED">
                    Delivered
                </option>

                <option value="CANCELLED">
                    Cancelled
                </option>

                <option value="REJECTED">
                    Rejected
                </option>

                <option value="DISPUTED">
                    Disputed
                </option>

            </select>


            <button id="refreshHistoryBtn"
                    type="button">

                Refresh

            </button>

        </section>



        <!-- MESSAGE -->

        <div id="historyMessage"></div>



        <!-- HISTORY -->

        <section class="history-section">


            <div id="historyContainer">

                <p>
                    Loading order history...
                </p>

            </div>


        </section>



        <!-- PAGINATION -->

        <section class="pagination-section">

            <button id="previousBtn"
                    type="button"
                    disabled>

                Previous

            </button>


            <span id="pageNumber">
                Page 1
            </span>


            <button id="nextBtn"
                    type="button">

                Next

            </button>

        </section>

        </main>
    </div>



    <!-- ORDER DETAILS MODAL -->

    <div id="historyModal"
         class="modal"
         style="display:none;">

        <div class="modal-content">


            <button id="closeModalBtn"
                    type="button"
                    class="close-btn">

                ×

            </button>


            <h2>
                Order Details
            </h2>


            <div id="historyDetails">

                <!-- Filled by history.js -->

            </div>

        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script src="../js/core/api.js"></script>

    <script src="../js/core/auth.js"></script>
    <script src="../js/buyer/buyer.js"></script>
    <script src="../js/buyer/history.js"></script>



</body>

</html>
