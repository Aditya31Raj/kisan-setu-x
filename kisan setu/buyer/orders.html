<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kisan Setu - Orders</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/buyer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="dashboard">
        <aside class="sidebar">
            <div class="brand"><img src="../images/logoks.jpeg" alt="Kisan Setu Logo"><div class="brand-text"><h2>KISAN SETU</h2><span>BUYER / VENDOR PORTAL</span></div></div>
            <div class="user-box"><div class="user-info"><div class="user-icon"><i class="fa-solid fa-store"></i></div><div><strong id="buyerSidebarName">Loading...</strong><span id="buyerSidebarId">Buyer / Vendor</span></div></div></div>
            <nav class="sidebar-nav">
                <div class="nav-title">Main Menu</div>
                <a href="../buyer_dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
                <a href="produce.html" class="nav-item"><i class="fa-solid fa-wheat-awn"></i><span>Find Produce</span></a>
                <a href="orders.html" class="nav-item active"><i class="fa-solid fa-box"></i><span>My Orders</span></a>
                <a href="payments.html" class="nav-item"><i class="fa-solid fa-credit-card"></i><span>Payments</span></a>
                <a href="logistics.html" class="nav-item"><i class="fa-solid fa-truck"></i><span>Logistics</span></a>
                <a href="history.html" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i><span>Payment History</span></a>
                <a href="disputes.html" class="nav-item"><i class="fa-solid fa-triangle-exclamation"></i><span>Disputes</span></a>
                <a href="notifications.html" class="nav-item"><i class="fa-solid fa-bell"></i><span>Notifications</span></a>
                <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
            </nav>
            <div class="logout"><a href="javascript:void(0)" id="logoutBtn" class="nav-item logout-btn"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></div>
        </aside>
        <main class="main">


    <main class="buyer-container">

        <section class="page-header">

            <h1>My Orders</h1>

            <p>
                View and manage your orders.
            </p>

        </section>


        <!-- ORDER FILTER -->

        <section class="order-controls">

            <label for="statusFilter">
                Order Status
            </label>

            <select id="statusFilter">

                <option value="">
                    All Orders
                </option>

                <option value="PENDING_FARMER">
                    Pending Farmer
                </option>

                <option value="ACCEPTED">
                    Accepted
                </option>

                <option value="PAYMENT_PENDING">
                    Payment Pending
                </option>

                <option value="PAID">
                    Paid
                </option>

                <option value="LOGISTICS_PENDING">
                    Logistics Pending
                </option>

                <option value="IN_TRANSIT">
                    In Transit
                </option>

                <option value="DELIVERED">
                    Delivered
                </option>

                <option value="COMPLETED">
                    Completed
                </option>

                <option value="CANCELLED">
                    Cancelled
                </option>

                <option value="DISPUTED">
                    Disputed
                </option>

            </select>

            <button
                type="button"
                id="refreshOrdersBtn">

                Refresh

            </button>

        </section>


        <!-- ORDERS -->

        <section class="orders-section">

            <div id="ordersContainer">

                <p>
                    Loading orders...
                </p>

            </div>

        </section>


        <!-- PAGINATION -->

        <section class="pagination-section">

            <button
                type="button"
                id="previousBtn"
                disabled>

                Previous

            </button>

            <span id="pageNumber">
                Page 1
            </span>

            <button
                type="button"
                id="nextBtn">

                Next

            </button>

        </section>

        </main>
    </div>


    <!-- ORDER DETAILS MODAL -->

    <div
        id="orderModal"
        class="modal"
        style="display: none;">

        <div class="modal-content">

            <button
                type="button"
                id="closeModalBtn"
                class="close-btn">

                ×

            </button>

            <h2>
                Order Details
            </h2>

            <div id="orderDetails">

                <!-- Loaded by orders.js -->

            </div>

        </div>

    </div>


    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/buyer/buyer.js"></script>
    <script src="../js/buyer/orders.js"></script>

</body>
</html>
