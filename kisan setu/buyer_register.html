<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kisan Setu | Buyer / Vendor Registration</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #F0FDF4;
            color: #202522;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 82px;
            background: white;
            border-bottom: 1px solid #e0e8e1;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5%;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-area img {
            width: 62px;
            height: 62px;
            object-fit: contain;
        }

        .logo-text h1 {
            color: #10B981;
            font-size: 22px;
            font-weight: 800;
        }

        .logo-text p {
            color: #68726c;
            font-size: 9px;
        }

        .back-home {
            text-decoration: none;
            color: #10B981;
            font-size: 13px;
            font-weight: 600;
        }

        .back-home:hover {
            color: #065F46;
        }

        /* ================= MAIN ================= */

        .main-container {
            min-height: calc(100vh - 82px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 45px 20px;
        }

        /* ================= REGISTER CARD ================= */

        .register-card {
            width: 850px;
            background: white;

            border-radius: 18px;

            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);

            overflow: hidden;

            border: 1px solid #e0e9e2;
        }

        /* ================= HEADER ================= */

        .register-header {
            background: linear-gradient(
                135deg,
                #10B981,
                #059669
            );

            color: white;

            text-align: center;

            padding: 28px 20px;
        }

        .register-header .icon {
            width: 65px;
            height: 65px;

            background: white;
            color: #10B981;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 12px;

            font-size: 28px;
        }

        .register-header h2 {
            font-size: 24px;
            font-weight: 700;
        }

        .register-header p {
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.9;
        }

        /* ================= FORM ================= */

        .form-container {
            padding: 32px 40px 38px;
        }

        .section-title {
            color: #10B981;
            font-size: 15px;
            font-weight: 700;

            margin-bottom: 18px;

            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            font-size: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 18px 25px;

            margin-bottom: 28px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: #37413b;

            margin-bottom: 7px;
        }

        label span {
            color: #e33434;
        }

        input,
        select {
            width: 100%;

            height: 43px;

            border: 1px solid #d5dfd7;
            border-radius: 7px;

            padding: 0 12px;

            font-family: inherit;
            font-size: 12px;

            outline: none;

            background: white;

            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #10B981;

            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.08);
        }

        /* ================= CHECKBOX ================= */

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;

            margin-bottom: 22px;

            font-size: 11px;
            color: #5d665f;
        }

        .terms input {
            width: 15px;
            height: 15px;
            margin-top: 1px;
        }

        .terms a {
            color: #10B981;
            text-decoration: none;
            font-weight: 600;
        }

        /* ================= BUTTON ================= */

        .register-button {
            width: 100%;

            height: 45px;

            border: none;
            border-radius: 8px;

            background: #10B981;

            color: white;

            font-family: inherit;
            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-button:hover {
            background: #059669;
        }

        .register-button i {
            margin-left: 8px;
        }

        /* ================= LOGIN LINK ================= */

        .login-text {
            text-align: center;

            margin-top: 20px;

            font-size: 12px;

            color: #68726c;
        }

        .login-text a {
            color: #10B981;

            text-decoration: none;

            font-weight: 600;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width:700px) {

            .form-container {
                padding: 25px 20px 30px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .logo-text p {
                display: none;
            }

            .logo-area img {
                width: 52px;
                height: 52px;
            }

            .register-card {
                width: 100%;
            }
        }

    </style>

</head>

<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <a href="index.html" class="logo-area">

            <!-- YOUR LOGO FILE -->
            <img src="images/logoks.jpeg" alt="Kisan Setu Logo">

            <div class="logo-text">

                <h1>KISAN SETU</h1>

                <p>
                    Direct Market. Fair Price. Stronger Farmers.
                </p>

            </div>

        </a>


        <div style="display: flex; align-items: center; gap: 14px;">
            <button type="button" class="lang-toggle-btn" title="Change Language / भाषा बदलें">
                <i class="fa-solid fa-globe"></i>
                <span class="lang-toggle-label">हिन्दी</span>
            </button>
            <a href="index.html" class="back-home">
                <i class="fa-solid fa-arrow-left"></i>
                <span data-i18n="back_to_home">Back to Home</span>
            </a>
        </div>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="main-container">


        <div class="register-card">


            <!-- HEADER -->

            <div class="register-header">

                <div class="icon">

                    <i class="fa-solid fa-store"></i>

                </div>

                <h2 data-i18n="buyer_register_title">Buyer / Vendor Registration</h2>

                <p data-i18n="buyer_register_sub">
                    Register to discover agricultural produce and connect with farmers.
                </p>

            </div>



            <!-- FORM -->

            <div class="form-container">


                <form id="buyerRegistrationForm">


                    <!-- ================= BUSINESS DETAILS ================= -->

                    <div class="section-title">

                        <i class="fa-solid fa-store"></i>

                        Business Details

                    </div>


                    <div class="form-grid">


                        <div class="form-group">

                            <label data-i18n="business_name">Business / Shop Name <span>*</span></label>

                            <input
                                type="text"
                                id="businessName"
                                placeholder="Enter business name" data-i18n-placeholder="business_name_ph"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label data-i18n="buyer_type">Buyer Type <span>*</span></label>

                            <select id="buyerType" required>

                                <option value="">
                                    Select buyer type
                                </option>

                                <option value="local-vendor">
                                    Local Vendor
                                </option>

                                <option value="retailer">
                                    Retailer
                                </option>

                                <option value="wholesaler">
                                    Wholesaler
                                </option>

                                <option value="institutional-buyer">
                                    Institutional Buyer
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label data-i18n="owner_name">Owner / Representative Name <span>*</span></label>

                            <input
                                type="text"
                                id="ownerName"
                                placeholder="Enter full name" data-i18n-placeholder="full_name_ph"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label data-i18n="business_reg_no">Business Registration No.</label>

                            <input
                                type="text"
                                id="businessReg"
                                placeholder="Optional"
                            >

                        </div>

                        <div class="form-group full">
                            <label for="profilePicture" data-i18n="profile_picture">Profile Picture</label>
                            <input type="file" id="profilePicture" accept="image/*">
                        </div>

                    </div>



                    <!-- ================= CONTACT DETAILS ================= -->

                    <div class="section-title">

                        <i class="fa-solid fa-address-book"></i>

                        Contact Details

                    </div>


                    <div class="form-grid">


                        <div class="form-group">

                            <label data-i18n="mobile_number">Mobile Number <span>*</span></label>

                            <input
                                type="tel"
                                id="mobile"
                                placeholder="10-digit mobile number" data-i18n-placeholder="mobile_ph"
                                maxlength="10"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label data-i18n="email_address">Email Address <span>*</span></label>

                            <input
                                type="email"
                                id="email"
                                placeholder="example@email.com" data-i18n-placeholder="email_ph"
                                required
                            >

                        </div>

                    </div>



                    <!-- ================= KYC ================= -->

                    <div class="section-title">

                        <i class="fa-solid fa-id-card"></i>

                        KYC Verification

                    </div>


                    <div class="form-grid">


                        <div class="form-group">

                            <label data-i18n="kyc_doc">KYC Document <span>*</span></label>

                            <select id="kycType" required>

                                <option value="">
                                    Select document
                                </option>

                                <option value="pan">
                                    PAN Card
                                </option>

                                <option value="gst">
                                    GSTIN
                                </option>

                                <option value="other">
                                    Other Government ID
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label data-i18n="kyc_number">KYC / Document Number <span>*</span></label>

                            <input
                                type="text"
                                id="kycNumber"
                                placeholder="Enter document number" data-i18n-placeholder="kyc_number_ph"
                                required
                            >

                        </div>

                    </div>



                    <!-- ================= LOCATION ================= -->

                    <div class="section-title">

                        <i class="fa-solid fa-location-dot"></i>

                        Business Location

                    </div>


                    <div class="form-grid">


                        <div class="form-group">

                            <label data-i18n="state">State <span>*</span></label>

                            <select id="state" required>

                                <option value="">
                                    Select State
                                </option>

                                <option>
                                    West Bengal
                                </option>

                                <option>
                                    Bihar
                                </option>

                                <option>
                                    Jharkhand
                                </option>

                                <option>
                                    Odisha
                                </option>

                                <option>
                                    Uttar Pradesh
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label data-i18n="district">District <span>*</span></label>

                            <input
                                type="text"
                                id="district"
                                placeholder="Enter district" data-i18n-placeholder="district_ph"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label data-i18n="block_prakhand">Block / Prakhand <span>*</span></label>

                            <input
                                type="text"
                                id="block"
                                placeholder="Enter block / prakhand" data-i18n-placeholder="block_ph"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label data-i18n="pincode">PIN Code <span>*</span></label>

                            <input
                                type="text"
                                id="pincode"
                                placeholder="6-digit PIN code" data-i18n-placeholder="pincode_ph"
                                maxlength="6"
                                required
                            >

                        </div>


                        <div class="form-group full">

                            <label data-i18n="business_address">Business Address <span>*</span></label>

                            <input
                                type="text"
                                id="address"
                                placeholder="Enter complete business address" data-i18n-placeholder="business_address_ph"
                                required
                            >

                        </div>

                    </div>



                    <!-- ================= LOGIN DETAILS ================= -->

                    <div class="section-title">

                        <i class="fa-solid fa-lock"></i>

                        Account Security

                    </div>


                    <div class="form-grid">


                        <div class="form-group">

                            <label data-i18n="create_password">Create Password <span>*</span></label>

                            <input
                                type="password"
                                id="password"
                                placeholder="Create password" data-i18n-placeholder="create_password_ph"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label data-i18n="confirm_password">Confirm Password <span>*</span></label>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm password" data-i18n-placeholder="confirm_password_ph"
                                required
                            >

                        </div>

                    </div>



                    <!-- ================= TERMS ================= -->

                    <div class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <label for="terms">

                            I agree to the Kisan Setu
                            <a href="#">Terms & Conditions</a>
                            and confirm that the information provided is accurate.

                        </label>

                    </div>



                    <!-- ================= SUBMIT ================= -->

                    <div id="buyerRegisterError" style="display:none; background:#fee2e2; border:1px solid #f87171; color:#991b1b; padding:10px 14px; border-radius:8px; font-size:13px; margin:14px 0;"></div>

                    <button
                        type="submit"
                        class="register-button"
                    >

                        <span data-i18n="register_btn_buyer">Create Buyer Account</span>

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>


                    <div class="login-text">

                        <span data-i18n="already_account">Already have an account?</span>

                        <a href="buyer_login.html" data-i18n="login_here">
                            Login here
                        </a>

                    </div>


                </form>

            </div>

        </div>

    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/core/api.js"></script>
    <script src="js/core/i18n.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/buyer/buyer.js"></script>
    <script src="js/core/profile-storage.js"></script>
    <script>

        const form =
            document.getElementById("buyerRegistrationForm");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();
            const errBox = document.getElementById("buyerRegisterError");
            const btn = this.querySelector("button[type='submit']");
            errBox.style.display = "none";

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (password !== confirmPassword) {
                errBox.textContent = "Passwords do not match.";
                errBox.style.display = "block";
                return;
            }

            if (password.length < 8) {
                errBox.textContent = "Password must be at least 8 characters long.";
                errBox.style.display = "block";
                return;
            }


            const mobile =
                document.getElementById("mobile").value.trim();


            if (!/^[0-9]{10}$/.test(mobile)) {
                errBox.textContent = "Please enter a valid 10-digit mobile number.";
                errBox.style.display = "block";
                return;
            }


            const ownerName = document.getElementById("ownerName").value.trim();
            const email = document.getElementById("email").value.trim();
            const businessName = document.getElementById("businessName").value.trim();
            const buyerType = document.getElementById("buyerType").value;
            const district = document.getElementById("district").value.trim();
            const state = document.getElementById("state").value;
            const kycType = document.getElementById("kycType").value;
            const kycNumber = document.getElementById("kycNumber").value.trim();

            if (!kycType || !kycNumber) {
                errBox.textContent = "Please provide your KYC Document Type and Document / GSTIN / PAN Number.";
                errBox.style.display = "block";
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Creating Account... <i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                let profilePicture = "";
                try {
                    profilePicture = await readProfilePicture(document.getElementById("profilePicture").files[0]);
                } catch {
                    // Profile picture is optional
                }

                saveRegistrationProfile("buyer", {
                    name: ownerName,
                    email: email,
                    phone: mobile,
                    businessName: businessName,
                    businessType: buyerType,
                    district: district,
                    state: state,
                    kycType: kycType,
                    kycNumber: kycNumber,
                    profilePicture
                });

                const payload = {
                    name: ownerName || businessName,
                    role: "BUYER",
                    password,
                    kycType,
                    kycNumber,
                    identityReference: `${kycType}: ${kycNumber}`
                };
                if (email) payload.email = email;
                if (mobile) payload.phone = mobile;

                await registerUser(payload);

                try {
                    await updateBuyerProfile({
                        businessName: businessName || undefined,
                        businessType: buyerType || undefined,
                        district: district || undefined,
                        state: state || undefined
                    });
                } catch (profileErr) {
                    console.warn("Buyer profile details could not be updated immediately:", profileErr);
                }

                window.location.href = "buyer_dashboard.html";

            } catch (error) {
                errBox.textContent = friendlyErrorMessage(error, "Registration failed. Please try again.");
                errBox.style.display = "block";
                btn.disabled = false;
                btn.innerHTML = 'Create Buyer Account <i class="fa-solid fa-arrow-right"></i>';
            }

        });

    </script>


</body>

</html>
