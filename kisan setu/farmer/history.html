<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kisan Setu - Farmer History</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/farmer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="brand">
                <img src="../images/logoks.jpeg" alt="Kisan Setu Logo">
                <div class="brand-text">
                    <h2>Kisan Setu</h2>
                    <span data-i18n="portal_farmer">FARMER PORTAL</span>
                </div>
            </div>

            <div class="user-box">
                <div class="user-info">
                    <div class="user-icon"><i class="fa-solid fa-user"></i></div>
                    <div>
                        <strong id="farmerSidebarName">Loading...</strong>
                        <span id="farmerSidebarId">Farmer Portal</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-title" data-i18n="overview">Overview</div>
                <a href="../farmer_dashboard.html" class="nav-item"><i class="fa-solid fa-gauge"></i> <span data-i18n="nav_dashboard">Dashboard</span></a>
                <a href="produce.html" class="nav-item"><i class="fa-solid fa-seedling"></i> <span data-i18n="nav_produce">Produce</span></a>
                <a href="inputs.html" class="nav-item"><i class="fa-solid fa-flask"></i> <span>Seeds & Fertilizers (बीज-खाद)</span></a>
                <a href="orders.html" class="nav-item"><i class="fa-solid fa-box"></i> <span data-i18n="nav_orders">Orders</span></a>
                <a href="payments.html" class="nav-item"><i class="fa-solid fa-wallet"></i> <span data-i18n="nav_payments">Payments</span></a>
                <a href="logistics.html" class="nav-item"><i class="fa-solid fa-truck"></i> <span data-i18n="nav_logistics">Logistics</span></a>
                <a href="history.html" class="nav-item active"><i class="fa-solid fa-clock-rotate-left"></i> <span data-i18n="nav_history">History</span></a>
                <a href="disputes.html" class="nav-item"><i class="fa-solid fa-circle-exclamation"></i> <span data-i18n="nav_disputes">Disputes</span></a>
                <a href="notifications.html" class="nav-item"><i class="fa-solid fa-bell"></i> <span data-i18n="nav_notifications">Notifications</span></a>
                <a href="profile.html" class="nav-item"><i class="fa-solid fa-user-gear"></i> <span data-i18n="nav_profile">Profile</span></a>
            </nav>
            <div class="logout">
                <a href="javascript:void(0)" id="logoutBtn" class="nav-item logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span data-i18n="nav_logout">Logout</span></a>
            </div>
        </aside>

        <div class="main">
            <main class="buyer-container">
        <section class="page-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <div>
            <h1>Order History</h1>
            <p>Review completed and past sales transactions.</p>
        </div>
            <button type="button" class="lang-toggle-btn" title="Change Language / भाषा बदलें">
                <i class="fa-solid fa-globe"></i>
                <span class="lang-toggle-label">हिन्दी</span>
            </button>
        </section>

        <section class="history-filter">
            <label for="statusFilter" data-i18n="filter_by_status">Filter by status:</label>
            <select id="statusFilter">
                <option value="ALL">All</option>
                <option value="COMPLETED">Completed</option>
                <option value="DELIVERED">Delivered</option>
                <option value="CANCELLED">Cancelled</option>
                <option value="REJECTED">Rejected</option>
                <option value="DISPUTED">Disputed</option>
            </select>
            <button id="refreshHistoryBtn" type="button" data-i18n="btn_refresh">Refresh</button>
        </section>

        <div id="historyMessage"></div>

        <section class="history-section">
            <div id="historyContainer">
                <p>Loading order history...</p>
            </div>
        </section>

        <section class="pagination-section">
            <button id="previousBtn" type="button" disabled data-i18n="btn_previous">Previous</button>
            <span id="pageNumber">Page 1</span>
            <button id="nextBtn" type="button" data-i18n="btn_next">Next</button>
        </section>
            </main>
        </div>
    </div>

    <div id="historyModal" class="modal" style="display:none;">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-btn">×</button>
            <h2>Order Details</h2>
            <div id="historyDetails"></div>
        </div>
    </div>

    <script src="../js/core/i18n.js"></script>
    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/farmer/farmer.js"></script>
    <script src="../js/farmer/history.js"></script>
</body>
</html>
