<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kisan Setu - Farmer Notifications</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/farmer.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="brand">
                <img src="../images/logoks.jpeg" alt="Kisan Setu Logo">
                <div class="brand-text">
                    <h2>Kisan Setu</h2>
                    <span>FARMER PORTAL</span>
                </div>
            </div>

            <div class="user-box">
                <div class="user-info">
                    <div class="user-icon"><i class="fa-solid fa-user"></i></div>
                    <div>
                        <strong id="farmerSidebarName">Loading...</strong>
                        <span id="farmerSidebarId">Farmer Portal</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-title">Overview</div>
                <a href="../farmer_dashboard.html" class="nav-item"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="produce.html" class="nav-item"><i class="fa-solid fa-seedling"></i> Produce</a>
                <a href="orders.html" class="nav-item"><i class="fa-solid fa-box"></i> Orders</a>
                <a href="payments.html" class="nav-item"><i class="fa-solid fa-wallet"></i> Payments</a>
                <a href="logistics.html" class="nav-item"><i class="fa-solid fa-truck"></i> Logistics</a>
                <a href="history.html" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
                <a href="disputes.html" class="nav-item"><i class="fa-solid fa-circle-exclamation"></i> Disputes</a>
                <a href="notifications.html" class="nav-item active"><i class="fa-solid fa-bell"></i> Notifications</a>
                <a href="profile.html" class="nav-item"><i class="fa-solid fa-user-gear"></i> Profile</a>
            </nav>
            <div class="logout">
                <a href="javascript:void(0)" id="logoutBtn" class="nav-item logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <div class="main">
            <main class="buyer-container">
        <section class="page-header">
            <h1>Notifications</h1>
            <p>Stay updated with buyer updates, payment alerts, and system messages.</p>
        </section>

        <section class="notification-controls">
            <button type="button" id="refreshNotificationsBtn">Refresh</button>
        </section>

        <div id="notificationMessage"></div>

        <section class="notifications-section">
            <div id="notificationsContainer">
                <p>Loading notifications...</p>
            </div>
        </section>

        <section class="pagination-section">
            <button type="button" id="previousBtn" disabled>Previous</button>
            <span id="pageNumber">Page 1</span>
            <button type="button" id="nextBtn">Next</button>
        </section>
            </main>
        </div>
    </div>

    <script src="../js/core/api.js"></script>
    <script src="../js/core/auth.js"></script>
    <script src="../js/farmer/farmer.js"></script>
    <script src="../js/farmer/notifications.js"></script>
</body>
</html>
